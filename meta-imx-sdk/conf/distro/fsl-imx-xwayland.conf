# i.MX DISTRO with Wayland and XWayland

require conf/distro/include/fsl-imx-base.inc

DISTRO = "fsl-imx-xwayland"
DISTRO_NAME = "NXP i.MX Distro with Wayland and XWayland"

# Remove conflicting backends
DISTRO_FEATURES:remove = "directfb "
DISTRO_FEATURES:append = " x11 wayland pam"

PACKAGECONFIG:append:pn-weston      = " rdp"
PACKAGECONFIG:append:pn-weston-init = " rdp"
