# ------------------------------------------------------------------
# Gitee Mirror Fragment for NXP i.MX BSP (GitHub → Gitee)
# ------------------------------------------------------------------
BB_CONF_FRAGMENT_SUMMARY = "Redirect NXP i.MX GitHub repositories to Gitee mirror"

BB_CONF_FRAGMENT_DESCRIPTION = " \
This fragment redirects fetch operations from GitHub (https://github.com/nxp-imx) \
to the Gitee mirror (https://gitee.com/nxp-china). \
It improves fetch performance and reliability in regions where GitHub access \
is slow or restricted (e.g., Asia/China). \
Both git:// and gitsm:// (Git submodules) protocols are supported. \
"

# ------------------------------------------------------------------
# PREMIRRORS mapping (GitHub → Gitee)
# ------------------------------------------------------------------
PREMIRRORS:append = " \
  git://github.com/nxp-imx      git://gitee.com/nxp-china \n \
  gitsm://github.com/nxp-imx    gitsm://gitee.com/nxp-china \n \
"
