#@TYPE: Machine
#@NAME: i.MX 95 Consolidated rootfs machine
#@SOC: i.MX95
#@DESCRIPTION: A Consolidated machine configuration for i.MX 95 19x19 LPDDR5 and
#               15x15 LPDDR4x EVK/FRDM, see Important Note below
#@MAINTAINER: Jun Zhu <junzhu@nxp.com>

#        ** Important Note **
# This machine generates an image contain the bootloader of 19x19 LPDDR5 EVK, Kernel, and rootfs, plus the DTBs of
# all 19x19 LPDDR5 and 15x15 LPDDR4x EVK/FRDM boards. The resulting image can be used for 19x19 LPDDR5 EVK directly,
# and it can be manually converted for other EVK/FRDM following the instructions in the User Guide - Consolidated Machines section.
# For users of all of EVK/FRDM variants, this can save build time and space. For most users, the dedicated machines
# imx95-19x19-lpddr5-evk.conf, imx95-19x19-lpddr5-frdm-pro.conf, imx95-15x15-lpddr4x-evk.conf and imx95-15x15-lpddr4x-frdm.conf should be used for simplicity.

MACHINEOVERRIDES =. "imx95-19x19-lpddr5-evk:"
require conf/machine/imx95-19x19-lpddr5-evk.conf

# Include device trees for other boards for internal test
KERNEL_DEVICETREE:append:use-nxp-bsp = " \
    freescale/imx95-jailhouse-inmate.dtb \
    freescale/imx95-15x15-ab2.dtb \
    freescale/imx95-15x15-evk.dtb \
    freescale/imx95-15x15-evk-adv7535-ap1302.dtb \
    freescale/imx95-15x15-frdm.dtb \
    freescale/imx95-15x15-frdm-8mic-reve.dtb \
    freescale/imx95-15x15-frdm-ap1302.dtb \
    freescale/imx95-15x15-frdm-aud-hat.dtb \
    freescale/imx95-15x15-frdm-boe-wxga-lvds-panel.dtb \
    freescale/imx95-15x15-frdm-dual-os08a20-isp.dtb \
    freescale/imx95-15x15-frdm-os08a20-combo-isp.dtb \
    freescale/imx95-15x15-frdm-os08a20-isp.dtb \
    freescale/imx95-15x15-frdm-root.dtb \
    freescale/imx95-15x15-frdm-rpmsg.dtb \
    freescale/imx95-15x15-frdm-waveshare-7inch-c-panel.dtb \
    freescale/imx95-19x19-frdm-pro.dtb \
    freescale/imx95-19x19-frdm-pro-aqr113c.dtb \
    freescale/imx95-19x19-frdm-pro-aud-hat.dtb \
    freescale/imx95-19x19-frdm-pro-dual-os08a20-isp.dtb \
    freescale/imx95-19x19-frdm-pro-inmate.dtb \
    freescale/imx95-19x19-frdm-pro-os08a20-combo-isp.dtb \
    freescale/imx95-19x19-frdm-pro-os08a20-isp.dtb \
    freescale/imx95-19x19-frdm-pro-root.dtb \
    freescale/imx95-19x19-frdm-pro-waveshare-7inch-c-panel.dtb \
"
IMAGE_BOOT_FILES:append = " \
    mcore-demos/imx95-15x15-evk_m7_TCM_hello_world.bin \
    mcore-demos/imx95-15x15-evk_m7_TCM_power_mode_switch.bin \
    mcore-demos/imx95-15x15-evk_m7_TCM_rpmsg_lite_pingpong_rtos_linux_remote.bin \
    mcore-demos/imx95-15x15-evk_m7_TCM_rpmsg_lite_str_echo_rtos.bin \
    mcore-demos/imx95-15x15-evk_m7_TCM_sai_low_power_audio.bin \
    mcore-demos/imx95-15x15-frdm_m7_TCM_hello_world.bin \
    mcore-demos/imx95-15x15-frdm_m7_TCM_power_mode_switch.bin \
    mcore-demos/imx95-15x15-frdm_m7_TCM_rpmsg_lite_pingpong_rtos_linux_remote.bin \
    mcore-demos/imx95-15x15-frdm_m7_TCM_rpmsg_lite_str_echo_rtos.bin \
    mcore-demos/imx95-19x19-frdm_m7_TCM_hello_world.bin \
    mcore-demos/imx95-19x19-frdm_m7_TCM_power_mode_switch.bin \
    mcore-demos/imx95-19x19-frdm_m7_TCM_rpmsg_lite_pingpong_rtos_linux_remote.bin \
    mcore-demos/imx95-19x19-frdm_m7_TCM_rpmsg_lite_str_echo_rtos.bin \
"
