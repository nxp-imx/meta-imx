#@TYPE: Machine
#@NAME: i.MX 943 Consolidated rootfs machine
#@SOC: i.MX943
#@DESCRIPTION: A Consolidated machine configuration for i.MX 943 LPDDR5 and LPDDR4x EVK, see Important Note below
#@MAINTAINER: Jun Zhu <junzhu@nxp.com>

#        ** Important Note **
# This machine generates an image contain the bootloader of 19x19 LPDDR5 EVK, Kernel, and rootfs, plus the DTBs of
# 19x19 LPDDR5 EVK, 19x19 LPDDR4x EVK and 15x15 LPDDR4x EVK boards. The resulting image can be used for 19x19 LPDDR5 EVK directly,
# and it can be manually converted for other EVK boards following the instructions in the User Guide - Consolidated Machines section.
# For users of all of EVK/QSB variants, this can save build time and space. For most users, the dedicated machines
# imx943-19x19-lpddr5-evk.conf, imx943-19x19-lpddr4-evk.conf and imx943-15x15-lpddr4x-evk.conf should be used for simplicity.

MACHINEOVERRIDES =. "imx943-19x19-lpddr5-evk:"
require conf/machine/imx943-19x19-lpddr5-evk.conf

# Include device trees for other boards for internal test
KERNEL_DEVICETREE += " \
"

