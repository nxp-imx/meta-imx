#@TYPE: Machine
#@NAME: i.MX 937 Consolidated rootfs machine
#@SOC: i.MX937
#@DESCRIPTION: A Consolidated machine configuration for i.MX 937 15x15 LPDDR5 FRDM, 19x19 LPDDR5 EVK and
#               15x15 LPDDR4x EVK, see Important Note below
#@MAINTAINER: Jun Zhu <junzhu@nxp.com>

#        ** Important Note **
# This machine generates an image contain the bootloader of 937 15x15 LPDDR5 FRDM, Kernel, and rootfs, plus the DTBs of
# 19x19 LPDDR5 EVK and 15x15 LPDDR4x EVK boards. The resulting image can be used for 937 15x15 LPDDR5 FRDM directly,
# and it can be manually converted for other EVK following the instructions in the User Guide - Consolidated Machines section.
# For users of all of EVK variants, this can save build time and space. For most users, the dedicated machines
# imx937-19x19-lpddr5-evk.conf,imx937-15x15-lpddr4x-evk.conf imx937-15x15-lpddr5-frdm.conf should be used for simplicity.

MACHINEOVERRIDES =. "imx937-15x15-lpddr5-frdm:"
require conf/machine/imx937-15x15-lpddr5-frdm.conf

# Include device trees for other boards for internal test
KERNEL_DEVICETREE:append:use-nxp-bsp  = " \
    freescale/imx937-evk.dtb \
"

IMAGE_BOOT_FILES:append = " \
    mcore-demos/imx937-15x15-frdm_m7_TCM_hello_world.bin \
    mcore-demos/imx937-15x15-frdm_m7_TCM_power_mode_switch.bin \
    mcore-demos/imx937-15x15-frdm_m7_TCM_rpmsg_lite_pingpong_rtos_linux_remote.bin \
    mcore-demos/imx937-15x15-frdm_m7_TCM_rpmsg_lite_str_echo_rtos.bin \
"
